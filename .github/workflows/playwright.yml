name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run full suite daily at 06:00 UTC to catch site changes
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      grep:
        description: 'Test tag to run (e.g. @smoke, @functional). Leave empty for all.'
        required: false
        default: ''

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run typecheck

  smoke:
    name: Smoke Tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        project: [chromium-desktop, mobile-chrome, tablet]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npx playwright test --project=${{ matrix.project }} --grep @smoke
        env:
          CI: true

      - name: Upload smoke test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

  full-suite:
    name: Full Suite (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: smoke
    timeout-minutes: 30
    # Only run full suite on push to main or on schedule — not on every PR
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false
      matrix:
        project: [chromium-desktop, mobile-chrome, tablet]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run full test suite
        run: |
          if [ -n "${{ github.event.inputs.grep }}" ]; then
            npx playwright test --project=${{ matrix.project }} --grep "${{ github.event.inputs.grep }}"
          else
            npx playwright test --project=${{ matrix.project }}
          fi
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test results JSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.project }}
          path: test-results/
          retention-days: 7

      - name: Upload failure screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-screenshots-${{ matrix.project }}
          path: test-results/**/*.png
          retention-days: 14
